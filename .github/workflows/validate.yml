name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile Python helpers
        run: python3 -m compileall -q skills/*/scripts
      - name: Verify distribution metadata
        run: |
          test -f skills/tuning-local-llms/SKILL.md
          test -f .claude-plugin/marketplace.json
          test -f .claude-plugin/plugin.json
          test -f plugin.yaml
          ! grep -R 'CLAUDE_SKILL_DIR' skills
      - name: Test Hermes adapter
        run: python3 tests/test_hermes_plugin.py
