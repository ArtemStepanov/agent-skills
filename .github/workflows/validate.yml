name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile Python helpers
        run: python3 -m compileall -q skills/*/scripts
      - name: Verify skill metadata is present
        run: test -f skills/tuning-local-llms/SKILL.md
